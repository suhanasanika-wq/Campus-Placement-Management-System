<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: 40px auto;
        }

        .profile-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .profile-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-row {
            margin: 15px 0;
            padding: 12px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .label {
            font-weight: bold;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 10px 18px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>Campus Placement Portal</h2>
        <a href="student-login.html">Logout</a>
    </div>

    <div class="container">

        <div class="profile-card">

            <h2>Student Profile</h2>

            <div class="profile-row">
                <span class="label">Name:</span>
                Suhana
            </div>

            <div class="profile-row">
                <span class="label">Email:</span>
                student@gmail.com
            </div>

            <div class="profile-row">
                <span class="label">Branch:</span>
                ISE
            </div>

            <div class="profile-row">
                <span class="label">CGPA:</span>
                9.00
            </div>

            <div class="profile-row">
                <span class="label">Skills:</span>
                Java, SQL
            </div>

            <a class="back-btn" href="student-dashboard.html">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>
</html>
